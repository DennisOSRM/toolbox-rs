<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Instructions retired after each change</title><desc id="d">Horizontal bars showing how the instruction count of a full run falls with each accepted change.</desc><rect width="900" height="386" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Instructions retired, cumulative after each change</text><text x="24.0" y="48.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">USA road network, -r30 -m100. Lower is better.</text><line x1="330.0" y1="78.0" x2="330.0" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="330.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">0</text><line x1="397.7" y1="78.0" x2="397.7" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="397.7" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1,000</text><line x1="465.4" y1="78.0" x2="465.4" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="465.4" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">2,000</text><line x1="533.1" y1="78.0" x2="533.1" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="533.1" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">3,000</text><line x1="600.9" y1="78.0" x2="600.9" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="600.9" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">4,000</text><line x1="668.6" y1="78.0" x2="668.6" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="668.6" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">5,000</text><line x1="736.3" y1="78.0" x2="736.3" y2="356.0" stroke="#e4e3df" stroke-width="1"/><text x="736.3" y="70.0" font-size="11" fill="#5251