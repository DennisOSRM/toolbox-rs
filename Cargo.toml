[package]
description = "A toolbox of basic data structures and algorithms"
edition = "2024"
homepage = "https://github.com/DennisOSRM/toolbox-rs"
license = "MIT"
name = "toolbox-rs"
readme = "README.md"
repository = "https://github.com/DennisOSRM/toolbox-rs"
version = "0.7.1"

[[example]]
name = "instantiate"

[[bin]]
name = "chipper"
path = "src/chipper/bin/main.rs"

[[bin]]
name = "scaffold"
path = "src/scaffold/bin/main.rs"

[[bin]]
name = "graph_plier"
path = "src/graph_plier/bin/main.rs"

[[bin]]
name = "solver"
path = "src/solver/bin/main.rs"

[[bin]]
name = "tile_server"
path = "src/tile_server/bin/main.rs"
required-features = ["tile_server"]

[features]
# The tile server is the only part that speaks protobuf. Keeping it behind a
# feature means a plain build of the library neither pulls in the codec crates
# nor runs the code generation of the build script.
tile_server = ["dep:actix-web", "dep:prost", "dep:prost-build", "dep:protox", "dep:serde"]

[dependencies]
actix-web = { version = "4.11.0", optional = true }
rkyv = "0.8.15"
bitvec = "1.0.1"
clap = { version = "4.5.38", features = ["derive"] }
env_logger = "0.11.8"
rustc-hash = "2.1.1"
geojson = "1.0.0"
indicatif = "0.18.0"
itertools = "0.15.0"
log = "0.4.27"
num = "0.4.3"
prost = { version = "0.14.4", optional = true }
rand = "0.10.0"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"], optional = true }
tempfile = "3.20.0"
thiserror = "2.0.12"
xxhash-rust = {version = "0.8.15", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
jemallocator = "0.5.4"

[build-dependencies]
# protox compiles the .proto in pure Rust, so no protoc has to be installed to
# build this crate, neither here nor on CI nor for anyone depending on it.
prost-build = { version = "0.14.4", optional = true }
protox = { version = "0.9.1", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
debug = true
lto = true

[[bench]]
name = "bench_main"
harness = false

[workspace.metadata.clippy]
# Enable additional clippy lints
extra_lints = ["clippy::pedantic", "clippy::nursery"]
