name: Rust

on:
  push:     
    branches:
      - main  
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: toolbox - latest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain:
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo test --verbose
      # The tile server is behind a feature, so the line above neither builds
      # nor runs any of it. protox compiles the .proto in pure Rust, so this
      # needs no protoc on the runner.
      - run: cargo test --features tile_server --verbose
